# Docs CI - mechanical validation of every pull request to main.
#
# Every check is scoped to what the PR changes (diff against the base branch), so
# debt that already exists on main never fails an unrelated PR. The scripts live in
# scripts/ci/ (Python 3 standard library) and can be run locally; see scripts/ci/README.md.
#
# No repository secrets are used. The built-in GITHUB_TOKEN is only used read-only to
# list the other open PRs (ADR number clash check).
name: Docs CI

on:
  pull_request:
    branches: [main]
    # "edited" re-runs the PR title check when the title is fixed.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: docs-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_REF: origin/${{ github.base_ref }}
    steps:
      - name: Check out the PR merged with its base (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The PR title is passed through an environment variable, never interpolated
      # into the shell command (script injection).
      - name: PR title follows Conventional Commits
        if: ${{ !cancelled() }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/ci/check_pr_title.py

      - name: Relative links in changed Markdown files
        if: ${{ !cancelled() }}
        run: python scripts/ci/check_links.py --base "$BASE_REF" --head HEAD

      - name: ADR numbers are unique
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/ci/check_adr.py --base "$BASE_REF" --head HEAD

      - name: No identity document numbers in added lines
        if: ${{ !cancelled() }}
        run: python scripts/ci/check_pii.py --base "$BASE_REF" --head HEAD

      - name: Detect OpenAPI changes
        id: openapi
        if: ${{ !cancelled() }}
        run: |
          merge_base="$(git merge-base "$BASE_REF" HEAD)"
          if git diff --name-only "$merge_base" HEAD -- '07-api/contracts/openapi/*.yaml' 'redocly.yaml' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No OpenAPI contract or redocly.yaml changes: lint skipped."
          fi

      - name: Set up Node.js
        if: ${{ !cancelled() && steps.openapi.outputs.changed == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: OpenAPI lint (only new errors fail)
        if: ${{ !cancelled() && steps.openapi.outputs.changed == 'true' }}
        run: python scripts/ci/check_openapi.py --base "$BASE_REF" --head HEAD
