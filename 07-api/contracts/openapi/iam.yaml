openapi: 3.1.0
info:
  title: IAM Service API — Horarios SENA
  version: 1.1.0
  description: >-
    Autenticación (JWT RS256/JWKS), gestión de usuarios, roles/features (RBAC
    feature+scope), sesiones, overrides de scope y reporte de auditoría de login.
    Fuente de verdad del contrato. Alineado con el modelo de datos de iam-service
    y con 07-api/guidelines.md. La extensión `x-required-feature` declara el feature
    RBAC de las operaciones con un requisito uniforme; las reglas condicionales se
    detallan en la descripción de la operación.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Autenticación y sesión.
  - name: m2m
    description: Emisión de tokens para servicios allowlisted.
  - name: jwks
    description: Publicación de claves públicas de firma.
  - name: users
    description: Gestión de cuentas de usuario.
  - name: sessions
    description: Sesiones activas de usuario (tokens de refresco vigentes).
  - name: roles
    description: Roles, features y asignaciones.
  - name: modules
    description: Catálogo de módulos y features (solo lectura).
  - name: reports
    description: Reportes propios del dominio IAM.
  - name: health
    description: Sondas públicas de liveness y readiness.

paths:
  # ---------------------------------------------------------------- auth
  /auth/token:
    post:
      operationId: issueServiceAccessToken
      tags: [m2m]
      summary: Issues a short-lived audience-bound M2M token for an allowlisted service.
      description: >-
        Accepts client_credentials with HTTP Basic authentication and an allowlisted
        audience. actors-service receives ACT_INTERNAL_FICHA_LEARNER_COUNT:GLOBAL,
        ACT_INTERNAL_FICHA_RAP_COVERAGE:GLOBAL, and ACADEMIC_FICHA_VIEW:GLOBAL.
        scheduling-service receives SCH_REPORT_VIEW:GLOBAL. The JWT aud claim contains
        the selected audience; client secrets are configured in secret storage.
        When audience is omitted the request is treated as actors-service, which is
        what the pre-R4 Academic client sends; this is a transitional allowance. A
        present but unknown or blank audience is rejected with invalid_target.
      security: []
      parameters:
        - name: Authorization
          in: header
          required: true
          description: HTTP Basic client_id and client_secret.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, const: client_credentials }
                audience:
                  type: string
                  enum: [actors-service, scheduling-service]
                  default: actors-service
                  description: Optional; omitted means actors-service (transitional compatibility).
      responses:
        '200':
          description: Bearer token with audience and allowed scopes; response is not cached.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, scope, audience]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, const: Bearer }
                  expires_in: { type: integer, minimum: 30, maximum: 900 }
                  scope: { type: string }
                  audience: { type: string, enum: [actors-service, scheduling-service] }
        '400':
          description: Unsupported grant type (unsupported_grant_type) or unknown audience (invalid_target).
        '401':
          description: Invalid client credentials.

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Autentica con email y contraseña.
      description: >-
        Devuelve el `access_token` en el cuerpo. El refresh token **no** viaja en el cuerpo:
        se entrega solo en la cabecera `Set-Cookie`, como la cookie `refresh_token` con
        `HttpOnly; Secure; SameSite=Strict; Path=/iam/api/v1/auth` y `Max-Age` igual a la vida
        del refresh token (7 días). El `Path` es el público: el edge quita el prefijo `/iam`
        antes de llegar al servicio (ADR-022), pero la cookie se emite con la ruta que ve el
        navegador (ADR-023 §6).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: >-
            Autenticación exitosa; devuelve el access token y el usuario con features. El
            refresh token viaja solo en la cookie de `Set-Cookie`.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '429': { $ref: '_shared.yaml#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Renueva el access_token con la cookie de refresh.
      description: >-
        Sin cuerpo. El navegador acompaña la petición con la cookie `refresh_token` que emitió
        `/auth/login` (ADR-023 §6). Devuelve un access token nuevo con los features
        recalculados. El refresh token no rota: la respuesta vuelve a emitir la misma cookie,
        con `Max-Age` igual al tiempo que le queda a la sesión, nunca más allá de su
        vencimiento en el servidor.

        Si la cookie no viene, o viene vacía, responde 401 `TOKEN_INVALID` (en el cable,
        `IAM_TOKEN_INVALID`). Si el refresh token es desconocido, venció o fue revocado,
        responde 401 `TOKEN_REVOKED` (en el cable, `IAM_TOKEN_REVOKED`).
      security:
        - refreshCookie: []
      responses:
        '200':
          description: >-
            Access token nuevo y usuario con features recalculados. No incluye el refresh token.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoca la sesión y borra la cookie de refresh.
      description: >-
        Identifica la sesión por la cookie `refresh_token` o por el `sid` del access token
        (Bearer); si vienen las dos, revoca cada una. Es idempotente y siempre borra la cookie
        (`Max-Age=0`, con los mismos `Path`, `Secure`, `HttpOnly` y `SameSite` con que se
        emitió). Sin cookie ni access token válido responde 401.
      security:
        - bearerAuth: []
        - refreshCookie: []
      responses:
        '204':
          description: Sesión revocada y cookie de refresh borrada.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearRefreshCookie' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Usuario autenticado con sus features y módulos calculados.
      responses:
        '200':
          description: Perfil del usuario autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Solicita un token de reset por email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: Aceptado. Siempre 202 (no revela si el email existe).
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '429': { $ref: '_shared.yaml#/components/responses/TooManyRequests' }

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Confirma el reset con el token recibido.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirm' }
      responses:
        '204':
          description: Contraseña actualizada.
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- users
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Lista paginada de usuarios.
      x-required-feature: IDENTITY_USER_VIEW
      parameters:
        - $ref: '_shared.yaml#/components/parameters/page'
        - $ref: '_shared.yaml#/components/parameters/page_size'
        - $ref: '_shared.yaml#/components/parameters/sort'
        - name: training_center_id
          in: query
          required: false
          description: Filtra por centro de formación.
          schema: { type: string, format: uuid }
        - name: role
          in: query
          required: false
          description: Filtra por nombre de rol.
          schema: { type: string }
        - name: is_active
          in: query
          required: false
          description: Filtra por estado de la cuenta.
          schema: { type: boolean }
      responses:
        '200':
          description: Página de usuarios.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  pagination: { $ref: '_shared.yaml#/components/schemas/Pagination' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
    post:
      operationId: createUser
      tags: [users]
      summary: Crea un usuario y devuelve su contraseña temporal.
      x-required-feature: IDENTITY_USER_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserCreateResponse' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUser
      tags: [users]
      summary: Detalle de un usuario.
      x-required-feature: IDENTITY_USER_VIEW
      responses:
        '200':
          description: Usuario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    put:
      operationId: updateUser
      tags: [users]
      summary: Actualiza datos del usuario (no contraseña).
      x-required-feature: IDENTITY_USER_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }

  /users/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: deactivateUser
      tags: [users]
      summary: Desactiva la cuenta (soft delete) y revoca sus sesiones.
      x-required-feature: IDENTITY_USER_MANAGE
      responses:
        '204':
          description: Cuenta desactivada.
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }

  /users/{id}/sessions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listUserSessions
      tags: [sessions]
      summary: Consulta sesiones propias o de otro usuario autorizado.
      description: >-
        El usuario autenticado puede consultar sus propias sesiones sin requerir un
        feature RBAC. Un administrador global (`SYSTEM_ADMIN` sin centro de formación)
        puede consultar sesiones ajenas con `IDENTITY_USER_VIEW` efectivo. Un rol
        administrativo limitado a un centro no autoriza consultas como administrador
        global.
      responses:
        '200':
          description: Lista de sesiones activas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }

  /users/{id}/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - name: session_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeUserSession
      tags: [sessions]
      summary: Revoca una sesión propia o, como administrador global, de otro usuario.
      description: >-
        Para una sesión propia, el usuario autenticado no requiere ningún feature RBAC.
        Para una sesión ajena, el solicitante debe ser un `SYSTEM_ADMIN` de alcance
        global y requiere `IDENTITY_USER_MANAGE` efectivo. `IDENTITY_USER_VIEW` por sí
        solo no autoriza revocar sesiones ajenas.
      responses:
        '204':
          description: Sesión revocada.
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }

  /users/{id}/roles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: assignUserRole
      tags: [roles]
      summary: Asigna un rol a un usuario (opcionalmente por centro).
      x-required-feature: IDENTITY_ROLE_ASSIGN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRoleRequest' }
      responses:
        '201':
          description: Rol asignado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRole' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: '_shared.yaml#/components/responses/Conflict' }

  /users/{id}/roles/{role_name}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - name: role_name
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeUserRole
      tags: [roles]
      summary: Revoca un rol de un usuario.
      x-required-feature: IDENTITY_ROLE_ASSIGN
      responses:
        '204':
          description: Rol revocado.
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }

  /users/{id}/scope-overrides:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listScopeOverrides
      tags: [roles]
      summary: Overrides de scope activos del usuario.
      x-required-feature: IDENTITY_SCOPE_MANAGE
      responses:
        '200':
          description: Lista de overrides.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScopeOverride' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
    post:
      operationId: createScopeOverride
      tags: [roles]
      summary: Crea un override de acceso para el usuario.
      x-required-feature: IDENTITY_SCOPE_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScopeOverrideCreate' }
      responses:
        '201':
          description: Override creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeOverride' }
        '400': { $ref: '_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }
        '422': { $ref: '_shared.yaml#/components/responses/UnprocessableEntity' }

  /users/{id}/scope-overrides/{override_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - name: override_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeScopeOverride
      tags: [roles]
      summary: Revoca un override de scope.
      x-required-feature: IDENTITY_SCOPE_MANAGE
      responses:
        '204':
          description: Override revocado.
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }

  # ---------------------------------------------------------------- roles / modules
  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: Lista de roles con sus features y scopes.
      x-required-feature: IDENTITY_ROLE_VIEW
      responses:
        '200':
          description: Lista de roles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }

  /roles/{id}/features:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listRoleFeatures
      tags: [roles]
      summary: Features asignados a un rol con su scope_type.
      x-required-feature: IDENTITY_ROLE_VIEW
      responses:
        '200':
          description: Features del rol.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleFeature' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_shared.yaml#/components/responses/NotFound' }

  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: Módulos del sistema con sus features.
      x-required-feature: IDENTITY_ROLE_VIEW
      responses:
        '200':
          description: Lista de módulos con features.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Module' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- reports (own domain)
  /reports/login-audit:
    get:
      operationId: reportLoginAudit
      tags: [reports]
      summary: Auditoría de intentos de login (paginación por cursor).
      description: >-
        Reporte propio del dominio IAM sobre la tabla `audit_login`. Solo lectura.
        Usa paginación por cursor por ser una colección grande/continua (guidelines §6).
        Inventario — Usuarios: seguridad/administración; Frecuencia: on-demand;
        Formato: JSON; Fuente: `identity_audit.audit_login`.
      x-required-feature: AUDIT_LOG_VIEW
      parameters:
        - $ref: '_shared.yaml#/components/parameters/cursor'
        - $ref: '_shared.yaml#/components/parameters/limit'
        - name: user_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: email
          in: query
          required: false
          description: Filtra por email intentado.
          schema: { type: string, format: email }
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [SUCCESS, INVALID_PASSWORD, USER_NOT_FOUND, ACCOUNT_LOCKED, TOKEN_EXPIRED]
        - name: from
          in: query
          required: false
          description: Inicio del rango (inclusive).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Fin del rango (exclusive).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Página de eventos de login.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LoginAuditEntry' }
                  pagination: { $ref: '_shared.yaml#/components/schemas/CursorPagination' }
        '401': { $ref: '_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_shared.yaml#/components/responses/Forbidden' }

  /health:
    servers:
      - url: /
    get:
      operationId: health
      tags: [health]
      summary: Liveness probe del servicio.
      security: []
      responses:
        '200':
          description: Servicio vivo.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: UP }
                additionalProperties: false
  /ready:
    servers:
      - url: /
    get:
      operationId: ready
      tags: [health]
      summary: Readiness probe del servicio.
      security: []
      responses:
        '200':
          description: Dependencias listas.
          content:
            application/json:
              schema:
                type: object
                required: [db, status]
                properties:
                  db: { type: string, enum: [ok, down] }
                  broker: { type: string, enum: [ok, down] }
                  status: { type: string, enum: [READY, NOT_READY] }
                additionalProperties: false
        '503':
          description: Alguna dependencia no está lista.
          content:
            application/json:
              schema:
                type: object
                required: [db, status]
                properties:
                  db: { type: string, enum: [ok, down] }
                  broker: { type: string, enum: [ok, down] }
                  status: { type: string, enum: [READY, NOT_READY] }
                additionalProperties: false
  /auth/.well-known/jwks.json:
    get:
      operationId: getJwks
      tags: [jwks]
      summary: Publica el JWKS vigente para validar access tokens emitidos por IAM.
      security: []
      responses:
        '200':
          description: Conjunto de llaves públicas JSON Web Key Set.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kty, use, alg, kid, n, e]
                      properties:
                        kty: { type: string, const: RSA }
                        use: { type: string, const: sig }
                        alg: { type: string, const: RS256 }
                        kid: { type: string }
                        n: { type: string }
                        e: { type: string }
                      additionalProperties: false
                additionalProperties: false

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: UUID del usuario.
      schema: { type: string, format: uuid }

  headers:
    SetRefreshCookie:
      description: >-
        Cookie `refresh_token`: el refresh token opaco, solo aquí y nunca en el cuerpo.
        Atributos fijos e iguales en todos los ambientes: `HttpOnly; Secure; SameSite=Strict;
        Path=/iam/api/v1/auth`. `Max-Age` es el tiempo que le queda a la sesión (7 días al
        iniciarla). `Path` es el público del edge y es configurable en el servicio
        (`IAM_REFRESH_COOKIE_PATH`) sin cambiar de comportamiento por ambiente.
      schema: { type: string }
      example: 'refresh_token=Zm9vYmFy; Path=/iam/api/v1/auth; Max-Age=604800; Expires=Sat, 31 Oct 2026 12:00:00 GMT; Secure; HttpOnly; SameSite=Strict'
    ClearRefreshCookie:
      description: >-
        Borra la cookie `refresh_token`: mismo nombre y mismos `Path`, `Secure`, `HttpOnly` y
        `SameSite` con que se emitió, valor vacío y `Max-Age=0`.
      schema: { type: string }
      example: 'refresh_token=; Path=/iam/api/v1/auth; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Secure; HttpOnly; SameSite=Strict'

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true, minLength: 8 }

    TokenResponse:
      type: object
      description: >-
        Respuesta de `/auth/login` y `/auth/refresh`. No incluye el refresh token: viaja solo en
        la cookie `refresh_token` de `Set-Cookie` (ADR-023 §6).
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Segundos de vida del access_token., example: 900 }
        user: { $ref: '#/components/schemas/AuthUser' }

    AuthUser:
      type: object
      required: [id, email, full_name, roles, features]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        roles:
          type: array
          items: { type: string }
        training_center_id:
          type: [string, 'null']
          format: uuid
        features:
          type: array
          items: { type: string }

    MeResponse:
      type: object
      required: [id, email, full_name, actor_type, roles, features, modules]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        actor_type:
          type: string
          enum: [USER, INSTRUCTOR, LEARNER]
        actor_id:
          type: [string, 'null']
          format: uuid
        roles:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              training_center_id:
                type: [string, 'null']
                format: uuid
        features:
          type: array
          items: { type: string }
        modules:
          type: array
          items: { type: string }

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    PasswordResetConfirm:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password: { type: string, writeOnly: true, minLength: 8 }

    User:
      type: object
      required: [id, email, first_name, last_name, actor_type, is_active, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        full_name:
          type: string
          readOnly: true
          description: Derivado de first_name + last_name.
        actor_type:
          type: string
          enum: [USER, INSTRUCTOR, LEARNER]
        actor_id:
          type: [string, 'null']
          format: uuid
          description: Referencia lógica al actor en actors-service (sin FK física).
        is_active: { type: boolean }
        last_login_at:
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserCreate:
      type: object
      required: [email, first_name, last_name, actor_type]
      properties:
        email: { type: string, format: email }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        actor_type:
          type: string
          enum: [USER, INSTRUCTOR, LEARNER]
        actor_id:
          type: [string, 'null']
          format: uuid
        initial_role: { type: string, description: Nombre del rol inicial a asignar. }
        training_center_id:
          type: [string, 'null']
          format: uuid

    UserCreateResponse:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        temporary_password:
          type: string
          writeOnly: true
          description: Contraseña temporal; también se envía al email del usuario.

    UserUpdate:
      type: object
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        actor_type:
          type: string
          enum: [USER, INSTRUCTOR, LEARNER]
        actor_id:
          type: [string, 'null']
          format: uuid
        is_active: { type: boolean }

    Session:
      type: object
      required: [id, created_at, expires_at, is_revoked]
      properties:
        id: { type: string, format: uuid }
        device_hint:
          type: [string, 'null']
          description: User-agent resumido.
        ip_address:
          type: [string, 'null']
          description: IP de origen (PII).
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        is_revoked: { type: boolean }
        revoked_at:
          type: [string, 'null']
          format: date-time

    AssignRoleRequest:
      type: object
      required: [role_name]
      properties:
        role_name: { type: string }
        training_center_id:
          type: [string, 'null']
          format: uuid
          description: null = rol global; UUID = restringido al centro.
        expires_at:
          type: [string, 'null']
          format: date-time

    UserRole:
      type: object
      required: [id, user_id, role_id, assigned_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role_id: { type: string, format: uuid }
        role_name: { type: string }
        training_center_id:
          type: [string, 'null']
          format: uuid
        assigned_by: { type: string, format: uuid }
        assigned_at: { type: string, format: date-time }
        expires_at:
          type: [string, 'null']
          format: date-time

    Role:
      type: object
      required: [id, name, display_name, is_system_role, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 50 }
        display_name: { type: string, maxLength: 100 }
        description:
          type: [string, 'null']
        is_system_role: { type: boolean }
        created_at: { type: string, format: date-time }

    RoleFeature:
      type: object
      required: [feature_code, scope_type]
      properties:
        feature_code: { type: string }
        feature_name: { type: string }
        action_level:
          type: string
          enum: [READ, WRITE, DELETE, PUBLISH, APPROVE]
        scope_type:
          type: string
          enum: [GLOBAL, TRAINING_CENTER, AREA, OWN_FICHAS, OWN_SCHEDULE, OWN_PROFILE, OWN_FICHA_AS_LEARNER]

    Module:
      type: object
      required: [code, name, features]
      properties:
        code: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 100 }
        description:
          type: [string, 'null']
        display_order: { type: integer }
        icon_key:
          type: [string, 'null']
        features:
          type: array
          items: { $ref: '#/components/schemas/Feature' }

    Feature:
      type: object
      description: Feature RBAC de un módulo (vista completa).
      required: [code, name, action_level, scope_type]
      properties:
        code: { type: string, maxLength: 60 }
        name: { type: string, maxLength: 120 }
        action_level:
          type: string
          enum: [READ, WRITE, DELETE, PUBLISH, APPROVE]
        scope_type:
          type: string
          enum: [GLOBAL, TRAINING_CENTER, AREA, OWN_FICHAS, OWN_SCHEDULE, OWN_PROFILE, OWN_FICHA_AS_LEARNER]
        description:
          type: [string, 'null']

    ScopeOverride:
      type: object
      required: [id, feature_code, scope_type, is_allowed, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        feature_code: { type: string }
        scope_type:
          type: string
          enum: [GLOBAL, TRAINING_CENTER, AREA, OWN_FICHAS, OWN_SCHEDULE, OWN_PROFILE, OWN_FICHA_AS_LEARNER]
        is_allowed:
          type: boolean
          description: true = acceso adicional; false = bloqueo explícito.
        reason: { type: string }
        granted_by: { type: string, format: uuid }
        expires_at:
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time }

    ScopeOverrideCreate:
      type: object
      required: [feature_code, scope_type, is_allowed, reason]
      properties:
        feature_code: { type: string }
        scope_type:
          type: string
          enum: [GLOBAL, TRAINING_CENTER, AREA, OWN_FICHAS, OWN_SCHEDULE, OWN_PROFILE, OWN_FICHA_AS_LEARNER]
        is_allowed: { type: boolean }
        reason: { type: string }
        expires_at:
          type: [string, 'null']
          format: date-time

    LoginAuditEntry:
      type: object
      required: [id, email_attempted, outcome, attempted_at]
      properties:
        id: { type: string, format: uuid }
        user_id:
          type: [string, 'null']
          format: uuid
          description: null si el email no existe.
        email_attempted: { type: string, format: email }
        outcome:
          type: string
          enum: [SUCCESS, INVALID_PASSWORD, USER_NOT_FOUND, ACCOUNT_LOCKED, TOKEN_EXPIRED]
        ip_address:
          type: [string, 'null']
        user_agent:
          type: [string, 'null']
        attempted_at: { type: string, format: date-time }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 emitido por iam-service; verificado localmente vía JWKS.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: >-
        Refresh token opaco que iam-service entrega en `Set-Cookie` al iniciar sesión
        (`HttpOnly; Secure; SameSite=Strict; Path=/iam/api/v1/auth`). Lo envía el navegador;
        el JavaScript de la página no puede leerlo.



