databaseChangeLog:
  # NO INCLUIR ESTE ARCHIVO EN changelog-master.yaml.
  # Ejecucion explicita en entorno aislado/despues del cambio de consumidor.
  - changeSet:
      id: r6-env-maintenance-reason-contract-v1
      author: jsgh1
      labels: "r6,contract,manual"
      comment: "Elimina reason tras migrar consumidores a reason_detail; rompe backend Go actual"
      changes:
        - sqlFile:
            path: 966_r6_reason_contract.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: 966_r6_reason_contract.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
        - sqlFile:
            path: ../../01_ddl/04_alter/964_r6_maintenance_reason_expand.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
